<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Why don't you just Google this?</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#171717}
body{background:#f6f6f4;display:grid;place-items:center}
.page{width:min(720px,calc(100% - 36px));text-align:center}
h1{font-size:clamp(38px,7vw,68px);line-height:1;letter-spacing:-.055em;margin:0 0 14px;font-weight:800}
.sub{color:#777;margin:0 0 28px}
.form{display:flex;gap:10px}
input{flex:1;height:58px;border:1px solid #d2d2ce;border-radius:11px;background:#fff;padding:0 18px;font-size:17px;outline:0}
input:focus{box-shadow:0 0 0 4px #0000000b;border-color:#999}
button{height:58px;border:0;border-radius:11px;background:#171717;color:#fff;padding:0 24px;font-size:16px;font-weight:700;cursor:pointer}
button:hover{opacity:.88}
.result{display:none;margin:20px auto 0;background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;text-align:left}
.result.show{display:block}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#888;margin-bottom:8px}
.url{font:14px/1.5 ui-monospace,monospace;word-break:break-all;margin-bottom:14px}
.url a{color:inherit}
.copy{height:44px;font-size:14px}
.copied{font-size:13px;color:#287437;margin-left:10px;opacity:0}
.copied.show{opacity:1}

#scene{display:none;position:fixed;inset:0;background:#f6f6f4;place-items:center;padding:18px}
#scene.show{display:grid}
.stage{width:min(850px,100%);text-align:center}
.caption{min-height:72px;font-size:clamp(20px,4vw,31px);font-weight:800;letter-spacing:-.03em}
.caption small{display:block;color:#777;font-size:13px;font-weight:400;margin-top:8px}
.browser{background:#fff;border:1px solid #d4d4d4;border-radius:13px;overflow:hidden;box-shadow:0 25px 80px #0002;text-align:left}
.top{height:42px;background:#eee;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 13px;gap:7px}
.dot{width:11px;height:11px;border-radius:50%;background:#c5c5c5}
.address{height:27px;flex:1;margin-left:12px;background:#fff;border-radius:6px;color:#999;padding:6px 11px;font-size:12px}
.google{padding:42px 35px 50px}
.logo{font-size:clamp(44px,8vw,70px);letter-spacing:-6px;font-weight:500;margin-bottom:24px}
.logo span:nth-child(1){color:#4285f4}.logo span:nth-child(2){color:#ea4335}.logo span:nth-child(3){color:#fbbc05}.logo span:nth-child(4){color:#4285f4}.logo span:nth-child(5){color:#34a853}.logo span:nth-child(6){color:#ea4335}
.search{height:55px;border:1px solid #dfe1e5;border-radius:28px;display:flex;align-items:center;padding:0 18px;box-shadow:0 1px 6px #20212422;font-size:18px}
.mag{width:17px;height:17px;border:2px solid #777;border-radius:50%;position:relative;margin-right:15px;flex:none}
.mag:after{content:"";position:absolute;width:7px;height:2px;background:#777;right:-5px;bottom:-3px;transform:rotate(45deg)}
.typed{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cursor{width:2px;height:22px;background:#222;margin-left:2px;animation:blink .65s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.note{font-size:13px;color:#888;margin-top:15px}
.google-buttons{display:flex;justify-content:center;gap:10px;margin-top:22px}
.google-buttons button{height:38px;border:1px solid #f8f9fa;border-radius:4px;background:#f8f9fa;color:#3c4043;padding:0 17px;font-size:14px;font-weight:400;cursor:default;box-shadow:0 1px 1px #00000012}
.search-btn.pressed{transform:translateY(1px);box-shadow:inset 0 2px 4px #0002;background:#e8e8e8}
.spinner{width:25px;height:25px;border:3px solid #ddd;border-top-color:#555;border-radius:50%;margin:20px auto 0;display:none;animation:spin .7s linear infinite}
.spinner.show{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:560px){.form{flex-direction:column}button{width:100%}.google{padding:35px 18px 45px}}
</style>
</head>
<body>

<main class="page" id="landing">
<h1>Why don't you just Google this?</h1>
<p class="sub">Seriously. It takes two seconds.</p>
<form class="form" id="form">
<input id="query" placeholder="What are we Googling?" autocomplete="off" required>
<button type="submit">Generate Link</button>
</form>
<section class="result" id="result">
<div class="label">Send this to the person who needs Google</div>
<div class="url"><a id="generatedLink" href="#"></a></div>
<button class="copy" id="copy">Copy Link</button><span class="copied" id="copied">Copied!</span>
</section>
</main>

<section id="scene">
<div class="stage">
<div class="caption" id="caption"></div>
<div class="browser">
<div class="top"><span class="dot"></span><span class="dot"></span><span class="dot"></span><div class="address">google.com</div></div>
<div class="google">
<div class="logo"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div>
<div class="search"><span class="mag"></span><span class="typed" id="typed"></span><span class="cursor"></span></div>
<div class="google-buttons"><button class="search-btn" id="searchBtn">Google Search</button><button class="lucky-btn">I'm Feeling Lucky</button></div>
<div class="spinner" id="spinner"></div>
</div>
</div>
<div class="note" id="note"></div>
</div>
</section>

<script>
(function(){
  "use strict";

  function getQuery(){
    var p = new URLSearchParams(window.location.search);
    var q = p.get("q");
    if(q) return q.trim();

    /* Also accept #q=... so it works even if a host rewrites query strings. */
    var hash = window.location.hash;
    if(hash.indexOf("#q=") === 0) return decodeURIComponent(hash.slice(3)).trim();

    return "";
  }

  function play(q){
    var landing=document.getElementById("landing");
    var scene=document.getElementById("scene");
    var caption=document.getElementById("caption");
    var typed=document.getElementById("typed");
    var note=document.getElementById("note");
    var spinner=document.getElementById("spinner");

    landing.style.display="none";
    scene.classList.add("show");
    caption.innerHTML="Oh, you don't know?<small>No problem. I got you.</small>";
    note.textContent="Please remain calm while I do this incredibly difficult task.";

    var i=0;
    var speed=Math.max(25,Math.min(60,1150/Math.max(q.length,1)));

    function type(){
      typed.textContent=q.slice(0,i);
      i++;
      if(i<=q.length){
        window.setTimeout(type,speed);
      }else{
        // Click Search immediately when typing finishes.
        var searchBtn=document.getElementById("searchBtn");
        searchBtn.classList.add("pressed");

        // Immediately show the result message, then pause 2 seconds before redirecting.
        caption.innerHTML="There you go.<small>That wasn't so hard, was it?</small>";
        note.textContent="Redirecting you to the actual search results…";
        spinner.classList.add("show");

        window.setTimeout(function(){
          window.location.assign("https://www.google.com/search?q="+encodeURIComponent(q));
        },2000);
      }
    }
    window.setTimeout(type,2000);
  }

  var incoming=getQuery();
  if(incoming) play(incoming);

  document.getElementById("form").addEventListener("submit",function(e){
    e.preventDefault();
    var q=document.getElementById("query").value.trim();
    if(!q)return;

    var url=new URL(window.location.href);
    url.search="";
    url.hash="";
    url.searchParams.set("q",q);

    var link=document.getElementById("generatedLink");
    link.href=url.href;
    link.textContent=url.href;
    document.getElementById("result").classList.add("show");
  });

  document.getElementById("copy").addEventListener("click",function(){
    var text=document.getElementById("generatedLink").href;
    navigator.clipboard.writeText(text).then(function(){
      document.getElementById("copied").classList.add("show");
      window.setTimeout(function(){document.getElementById("copied").classList.remove("show")},1800);
    }).catch(function(){
      window.prompt("Copy this link:",text);
    });
  });
})();
</script>
</body>
</html>
